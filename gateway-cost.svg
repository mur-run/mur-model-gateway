<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" height="426"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="t d">
  <title id="t">Gateway cost per request, compression off versus on</title>
  <desc id="d">Two panels. CPU per request: compression off 0.05 ms; compression on 27.6 ms at a
  2 KB body with nothing eligible to compress, 30.6 ms at 8 KB, 37.9 ms at 32 KB, 66.4 ms at 128 KB.
  Resident memory: compression off 9 MB, compression on 132 MB, with a live instance after eight
  hours of real traffic at 43 MB. Apple M4, release build, concurrency 4, mock upstream on
  loopback.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .ink2    { fill: #52514e; }
    .muted   { fill: #898781; }
    .grid    { stroke: #dedcd6; }
    .axis    { stroke: #b8b5ad; }
    .s-off   { fill: #2a78d6; }
    .s-on    { fill: #eb6834; }
    .ref     { stroke: #52514e; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .ink2    { fill: #c3c2b7; }
      .muted   { fill: #898781; }
      .grid    { stroke: #333230; }
      .axis    { stroke: #4a4844; }
      .s-off   { fill: #3987e5; }
      .s-on    { fill: #d95926; }
      .ref     { stroke: #c3c2b7; }
    }
  </style>

  <rect class="surface" width="880" height="426" rx="10"/>

  <!-- legend -->
  <rect class="s-off" x="56" y="22" width="11" height="11" rx="2"/>
  <text class="ink2" x="74" y="32" font-size="13">compression off</text>
  <rect class="s-on" x="196" y="22" width="11" height="11" rx="2"/>
  <text class="ink2" x="214" y="32" font-size="13">compression on</text>

  <!-- ── panel A: CPU ────────────────────────────────────────────── -->
  <text class="ink" x="56" y="62" font-size="15" font-weight="600">CPU per request</text>
  <text class="muted" x="187" y="62" font-size="13">milliseconds</text>

  <g class="grid" stroke-width="1">
    <line x1="56" y1="115.7" x2="520" y2="115.7"/>
    <line x1="56" y1="187.1" x2="520" y2="187.1"/>
    <line x1="56" y1="258.6" x2="520" y2="258.6"/>
  </g>
  <g class="muted" font-size="11" text-anchor="end">
    <text x="48" y="119.7">60</text>
    <text x="48" y="191.1">40</text>
    <text x="48" y="262.6">20</text>
    <text x="48" y="334">0</text>
  </g>
  <line class="axis" x1="56" y1="330" x2="520" y2="330" stroke-width="1"/>

  <!-- off: 0.05 ms — true height is a fraction of a pixel; drawn as a 2px
       trace so it reads as present-but-negligible, with the value labelled. -->
  <rect class="s-off" x="76" y="328" width="52" height="2"/>
  <path class="s-on" d="M169 330 V235.4 q0-4 4-4 h44 q4 0 4 4 V330 Z"/>
  <path class="s-on" d="M262 330 V224.7 q0-4 4-4 h44 q4 0 4 4 V330 Z"/>
  <path class="s-on" d="M355 330 V198.6 q0-4 4-4 h44 q4 0 4 4 V330 Z"/>
  <path class="s-on" d="M448 330 V96.9 q0-4 4-4 h44 q4 0 4 4 V330 Z"/>

  <g class="ink" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="102" y="320">0.05</text>
    <text x="195" y="227">27.6</text>
    <text x="288" y="216">30.6</text>
    <text x="381" y="190">37.9</text>
    <text x="474" y="88">66.4</text>
  </g>
  <g class="ink2" font-size="12" text-anchor="middle">
    <text x="102" y="350">off</text>
    <text x="195" y="350">2 KB *</text>
    <text x="288" y="350">8 KB</text>
    <text x="381" y="350">32 KB</text>
    <text x="474" y="350">128 KB</text>
  </g>
  <text class="muted" x="288" y="371" font-size="11.5" text-anchor="middle">size of the tool_result in the request body</text>

  <!-- ── panel B: memory ─────────────────────────────────────────── -->
  <text class="ink" x="620" y="62" font-size="15" font-weight="600">Resident memory</text>
  <text class="muted" x="757" y="62" font-size="13">MB</text>

  <g class="grid" stroke-width="1">
    <line x1="620" y1="151.4" x2="850" y2="151.4"/>
    <line x1="620" y1="240.7" x2="850" y2="240.7"/>
  </g>
  <g class="muted" font-size="11" text-anchor="end">
    <text x="612" y="155.4">100</text>
    <text x="612" y="244.7">50</text>
    <text x="612" y="334">0</text>
  </g>
  <line class="axis" x1="620" y1="330" x2="850" y2="330" stroke-width="1"/>

  <rect class="s-off" x="637" y="313.9" width="52" height="16.1" rx="3"/>
  <path class="s-on" d="M781 330 V98.3 q0-4 4-4 h44 q4 0 4 4 V330 Z"/>

  <!-- live reference: the author's own instance after 8 h of real traffic -->
  <line class="ref" x1="620" y1="253.2" x2="850" y2="253.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="ink2" x="620" y="248" font-size="11">43 MB — live instance, 8 h of real traffic</text>

  <g class="ink" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="663" y="306">9</text>
    <text x="807" y="89">132</text>
  </g>
  <g class="ink2" font-size="12" text-anchor="middle">
    <text x="663" y="350">off</text>
    <text x="807" y="350">on</text>
  </g>
  <text class="muted" x="735" y="371" font-size="11.5" text-anchor="middle">same 2 KB body, separate processes</text>

  <text class="ink2" x="56" y="392" font-size="11">* the 2 KB body has nothing eligible to compress — that bar is the fixed cost of turning the feature on</text>
  <text class="muted" x="56" y="410" font-size="11">Apple M4 (4P+6E, 16 GB) · release build · concurrency 4 · mock upstream on loopback</text>
</svg>
