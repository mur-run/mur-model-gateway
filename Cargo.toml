[package]
name = "mur-model-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "5"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
# git tag (not local path) so mur-model-gateway builds on deploy hosts without a mur checkout;
# keep the tag in lockstep with the mur version you develop against.
mur-compress = { git = "https://github.com/mur-run/mur.git", tag = "v2.40.1", package = "mur-compress" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whoami = "1"

[dev-dependencies]
httpmock = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
